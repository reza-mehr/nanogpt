[project]
name = "nanogpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Reza Mehr", email = "334387066+reza-mehr@users.noreply.github.com" }
]
requires-python = ">=3.9"
